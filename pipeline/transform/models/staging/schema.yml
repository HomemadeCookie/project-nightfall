version: 2

models:
  - name: raw_adsb_documents
    description: >
      One row per stored adsb.lol response. The only model that touches the landing zone
      directly, and the only one that has to survive a cold start with no objects yet.
    columns:
      - name: response_ms
        description: Response assembly instant, milliseconds since the Unix epoch.
      - name: raw_object
        description: Landing-zone object name; the provenance key for invariant 7.

  - name: raw_ais_frames
    description: >
      One row per stored AISStream frame, with the collector's receive time from the storage
      envelope. Cold start yields an empty relation rather than an error.
    columns:
      - name: received_unix
        description: When the collector received the frame. The only absolute time AIS has.
      - name: raw_object
        description: Landing-zone object name; the provenance key for invariant 7.

  - name: stg_adsb_positions
    description: adsb.lol aircraft positions, typed and clipped to the Philippine AOI.
    data_tests:
      - nightfall.observed_at_is_plausible
      - nightfall.position_is_in_aoi
    columns:
      - name: entity_id
        description: ICAO 24-bit address, lowercased.
        data_tests:
          - not_null
      - name: observed_at
        description: >
          When the position fix was true, not when the response was assembled: the response
          instant less `seen_pos`.
        data_tests:
          - not_null
      - name: altitude_ft
        description: >
          Barometric altitude. Null for an aircraft on the ground, where the wire field holds
          the string "ground" rather than a number.
      - name: mode
        data_tests:
          - accepted_values:
              arguments:
                values: ["air"]

  - name: stg_ais_positions
    description: AISStream vessel positions, typed and clipped to the Philippine AOI.
    data_tests:
      - nightfall.observed_at_is_plausible
      - nightfall.position_is_in_aoi
    columns:
      - name: entity_id
        description: MMSI as text.
        data_tests:
          - not_null
      - name: observed_at
        description: Collector receive time. AIS carries no absolute time of its own.
        data_tests:
          - not_null
      - name: mode
        data_tests:
          - accepted_values:
              arguments:
                values: ["sea"]
