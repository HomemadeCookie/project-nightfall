[project]
name = "nightfall-pipeline"
version = "0.1.0"
description = "project-nightfall batch pipeline: collect, transform, verify, bake"
requires-python = "==3.13.*"
dependencies = [
    "duckdb==1.5.5",
    "dbt-core==1.12.4",
    "dbt-duckdb==1.11.0",
    "httpx==0.28.1",
    "websockets==17.1",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "pyarrow==25.0.1",
    "huggingface-hub==1.31.0",
]

[project.scripts]
nightfall = "nightfall.cli:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "mypy==2.3.1",
    "ruff==0.16.7",
]

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nightfall"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "DTZ", "T20", "RET", "SIM", "ARG", "PTH", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]
# `summarise.py` writes markdown to stdout for a run summary; `print` is its whole job.
"scripts/summarise.py" = ["T201"]
# `seed_demo.py` must put the repository on the path before it can import the test fixtures.
"scripts/seed_demo.py" = ["E402"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
files = ["src", "tests", "scripts"]
# Without the plugin, mypy cannot see the fields a model generates and reports every
# construction as an error. `disallow_any_explicit` is deliberately not set: it rejects any
# subclass of pydantic's BaseModel, and Pydantic is the mandated boundary validator.
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
# Not set: the credential fields below take deliberate AliasChoices so a token can be read
# from either the prefixed or the conventional environment variable name.
warn_required_dynamic_aliases = false

[[tool.mypy.overrides]]
module = ["huggingface_hub.*", "duckdb.*", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
