[project]
name = "nightfall"
version = "0.1.0"
description = "Supply-chain intelligence for the Philippines from free public data."
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.1",
  "pyarrow>=17",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pyyaml>=6",
  "h3>=4",
  "numpy>=2",
  "openpyxl>=3.1",
  "websockets>=13",
  "pdfplumber>=0.11.10",
  "scikit-learn>=1.9.1",
  "pytz>=2026.5",
]

[project.scripts]
nightfall = "nightfall.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "import-linter>=2", "pytest-cov>=5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nightfall"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # the formatter wraps code; long SQL/text literals are fine

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E741"]  # `lambda l:` for the lake is fine in tests

[tool.importlinter]
root_package = "nightfall"

[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = [
  "nightfall.cli",
  "nightfall.publish",
  "nightfall.eval",
  "nightfall.answers",
  "nightfall.indicators",
  "nightfall.detect | nightfall.stage | nightfall.sources",
  "nightfall.core",
]
