name: pipeline

# Collect, transform, bake, publish. One run does all four, deliberately.
#
# Splitting collection from publication would mean the raw objects had to survive between
# workflow runs, and the only free place to put them is the archive — so a publication would
# then depend on reaching a third party, which invariant 3 forbids of the read path. Keeping
# the stages in one run means a publication depends on nothing but this runner: the archive
# upload and restore are enrichments that may fail without taking the site down with them.
#
# The schedule is deliberately irregular. Vessel and aircraft traffic both follow the clock, so
# sampling at the same times every day would produce a picture of four moments rather than of
# Philippine movement, and every aggregate built on it would inherit that bias.

on:
  schedule:
    - cron: '17 2 * * *'   # 10:17 Manila
    - cron: '43 7 * * *'   # 15:43 Manila
    - cron: '11 13 * * *'  # 21:11 Manila
    - cron: '29 18 * * *'  # 02:29 Manila
  workflow_dispatch:
    inputs:
      collect:
        description: Run the collectors, or publish from the archive alone
        type: boolean
        default: true

permissions:
  contents: read

# Never two publications at once, and never cancel one in flight: a cancelled run leaves the
# collected window unarchived, which is a permanent hole in the history.
concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Two bounded collection windows plus the build. Generous enough to absorb a slow upstream,
    # bounded so a hung job cannot run for six hours.
    timeout-minutes: 30

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    env:
      NIGHTFALL_ARCHIVE_REPO: ${{ vars.NIGHTFALL_ARCHIVE_REPO }}
      NIGHTFALL_HF_TOKEN: ${{ secrets.NIGHTFALL_HF_TOKEN }}
      NIGHTFALL_AISSTREAM_API_KEY: ${{ secrets.NIGHTFALL_AISSTREAM_API_KEY }}

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: uv sync --locked
        working-directory: pipeline

      # Both collectors run concurrently because each is a bounded window of wall-clock time,
      # not work: running them in sequence would double the window for no extra data. Neither
      # can fail the job — a source outage degrades freshness, and the UI says so.
      - name: Collect
        if: github.event_name == 'schedule' || inputs.collect
        run: |
          uv run --project pipeline nightfall collect adsb_lol &
          adsb=$!
          uv run --project pipeline nightfall collect aisstream &
          ais=$!
          wait $adsb
          wait $ais

      # Archive before transform: the raw objects are the archive's reason to exist, and a
      # failure in a later stage must not cost us the observations.
      - name: Archive raw objects
        if: github.event_name == 'schedule' || inputs.collect
        run: uv run --project pipeline nightfall archive

      - name: Restore the recent window from the archive
        run: uv run --project pipeline nightfall restore

      - name: Transform
        run: uv run --project pipeline nightfall transform

      - name: Bake
        run: uv run --project pipeline nightfall bake

      - name: Fetch the basemap
        # Built by `build-basemap.yml` and stored in the archive, because Pages has no way to
        # carry a large asset between deployments. Absence is handled: the app draws positions
        # without geographic context and says why.
        continue-on-error: true
        run: uv run --project pipeline python pipeline/scripts/fetch_basemap.py

      - run: npm ci
        working-directory: web

      - run: npm run build
        working-directory: web

      # The serving set travels inside the site, at the relative path the manifest assumes.
      - name: Assemble the site
        run: cp -r build/serving web/dist/serving

      - name: Check the Pages ceiling
        # Pages refuses a site over 1 GB. The bake stage already asserts this for the serving
        # set; this covers the assembled site, which is what actually gets deployed.
        run: |
          bytes=$(du -sb web/dist | cut -f1)
          echo "site is $bytes bytes"
          if [ "$bytes" -gt 943718400 ]; then
            echo "::error::the assembled site exceeds 900 MB, approaching the 1 GB Pages ceiling"
            exit 1
          fi

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

      - id: deploy
        uses: actions/deploy-pages@v5

      - name: Summarise the run
        # Always, including after a failure: what was collected and what was missed is the
        # information a reader needs, and it is most needed when something went wrong.
        if: always()
        run: python3 pipeline/scripts/summarise.py build/serving/manifest.json
          >> "$GITHUB_STEP_SUMMARY"
