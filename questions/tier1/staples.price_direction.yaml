id: staples.price_direction
version: 1
tier: 1
status: experimental
buyers:
- distributors
- retailers
- brands
decision: Buy ahead or hold off on rice, sugar and cooking oil.
ask:
  en: Will this staple get more expensive over the next 4 weeks?
  fil: Tataas ba ang presyo nito sa susunod na 4 na linggo?
scope:
  item: price item id
  region: NCR
cadence: weekly
inputs:
- da_prices.weekly_ncr
- worldbank.pink_sheet_monthly
- frankfurter.usd_php
- eia.spot_prices
baseline: persistence (same direction as the last 4 weeks) and majority class
metric:
  primary: balanced_accuracy
  secondary:
  - accuracy
ship_when: Balanced accuracy >= max(persistence, majority) + 0.05 over >= 26 walk-forward origins; only
  passing items publish a forecast.
min_coverage: 0.5
outputs:
- web
- bot
- feed
notes: NCR only; DA publishes weekly regional averages for Metro Manila markets.
