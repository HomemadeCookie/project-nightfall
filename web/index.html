<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5" />
    <meta name="color-scheme" content="dark" />
    <title>project nightfall — observed movement over the Philippines</title>
    <meta
      name="description"
      content="Sampled aircraft and vessel movement over the Philippines, built from open data on a static site."

    -->

    <script type="module" src="/src/main.tsx"></script>
  </body>
